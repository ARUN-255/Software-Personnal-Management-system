server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: jdbc:h2:file:./data/personnel;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personnel_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
